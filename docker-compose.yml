# 4コンテナ構成：caddy（HTTPS・画像配信）/ app（画面・API）/ bot（Discord常駐）/ worker（定期処理・画像処理）
# 更新：docker compose pull && docker compose up -d   （DBマイグレーションは app 起動時に自動適用）
name: ebay-ops

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/hegelgelda/ebayopssystem:latest}
  build:
    context: .
    args:
      INSTALL_REMBG: ${INSTALL_REMBG:-1}
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /data
  volumes:
    - data:/data
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  app:
    <<: *app
    command: >
      sh -c "python -m app.cli migrate &&
             exec uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      app: { condition: service_healthy }
    mem_limit: ${WORKER_MEM_LIMIT:-2g}  # rembg（u2net）が約1.3GBを使う

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    depends_on:
      app: { condition: service_healthy }

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data/app:ro
      - caddy_data:/data/caddy
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  data:
  caddy_data:
  caddy_config:
